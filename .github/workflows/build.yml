# Builds the portable app and the installer on a clean Windows runner.
# Release binaries come from here, not from a developer machine, so they can be
# traced back to a commit — which is what SignPath requires before it signs anything.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests

      # The Inno installer is an optional extra; releases ship the two PyInstaller exes
      - name: Build
        run: python build_exe.py --no-inno

      - uses: actions/upload-artifact@v7
        with:
          name: LanguageFixerPro
          path: |
            dist/LanguageFixerPro.exe
            dist/LanguageFixerPro-Setup.exe
          if-no-files-found: error
